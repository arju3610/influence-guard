services:
  - type: web
    name: influence-guard-ai
    env: python
    plan: free
    
    # Install dependencies
    buildCommand: pip install -r requirements.txt
    
    # Start the Streamlit app with secrets setup
    startCommand: python start.py
    
    # Environment variables
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
